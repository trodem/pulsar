# Pulsar — two-service deployment: Node/Express API (server) + nginx-served
# Vue SPA (client) that reverse-proxies /api and /socket.io to the server.
#
# Copy .env.example -> .env and set JWT_SECRET before `docker compose up -d --build`.
# The app is then reachable at http://localhost:8080.

# Pulsar — two-service deployment: Node/Express API (server) + nginx-served
# Vue SPA (client) that reverse-proxies /api and /socket.io to the server.
#
# Copy .env.example -> .env and set JWT_SECRET before `docker compose up -d --build`.
# The app is then reachable at http://localhost:8190.

services:
  server:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 3021
      CLIENT_ORIGIN: "*"
      DB_PATH: ./data/uptime.db
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      STAP_LOG_ENABLED: ${STAP_LOG_ENABLED:-true}
      STAP_LOG_UNC: ${STAP_LOG_UNC:-}
      STAP_LOG_USER: ${STAP_LOG_USER:-}
      STAP_LOG_PASSWORD: ${STAP_LOG_PASSWORD:-}
    volumes:
      - pulsar-data:/app/data
    cap_add:
      - NET_RAW
    networks:
      - pulsar_net

  client:
    build: ./client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${WEB_PORT:-8190}:80"
    networks:
      - pulsar_net

volumes:
  pulsar-data:

networks:
  pulsar_net:
    driver: bridge
    # ipam:
    #   config:
    #     - subnet: 10.250.0.0/24
