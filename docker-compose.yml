# Pulsar — two-service deployment: Node/Express API (server) + nginx-served
# Vue SPA (client) that reverse-proxies /api and /socket.io to the server.
#
# Copy .env.example -> .env and set JWT_SECRET before `docker compose up -d --build`.
# The app is then reachable at http://localhost:8080.

services:
  server:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 3021
      # nginx proxies same-origin, so any origin is fine here.
      CLIENT_ORIGIN: "*"
      DB_PATH: ./data/uptime.db
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # STAP logged-user extraction (http-ping monitors) — optional.
      STAP_LOG_ENABLED: ${STAP_LOG_ENABLED:-true}
      STAP_LOG_UNC: ${STAP_LOG_UNC:-}
      STAP_LOG_USER: ${STAP_LOG_USER:-}
      STAP_LOG_PASSWORD: ${STAP_LOG_PASSWORD:-}
    volumes:
      - pulsar-data:/app/data
    # ICMP ping from an unprivileged container needs the raw-socket capability.
    cap_add:
      - NET_RAW
    # Uncomment to hit the API directly (otherwise only the client reaches it).
    # ports:
    #   - "3021:3021"

  client:
    build: ./client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${WEB_PORT:-8090}:80"

volumes:
  pulsar-data:
